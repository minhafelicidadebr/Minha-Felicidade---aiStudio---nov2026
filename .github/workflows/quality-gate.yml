name: Quality Gate

on:
  pull_request:
    branches: [main, aistudio/work, aistudio/c2-review]
  push:
    branches: [main, aistudio/work, aistudio/c2-review]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:security

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security invariants
        run: npm run security:gate

  # ───────────────────────────────────────────────────────────────────────────────
  # TRUST-1.5 / R25 — contratos de runtime contra PostgreSQL real.
  #
  # POR QUE ESTE JOB EXISTE
  # O R20 provou que invariante de texto não basta: `resend_invitation` passava em
  # todo teste que LIA o SQL e falhava em toda invocação real. Os contratos de
  # runtime pegam isso — mas até aqui rodavam só na máquina de quem tinha Docker,
  # e no CI eram PULADOS. "0 testes executados" aparecia como verde.
  #
  # Este job sobe o stack Supabase local no runner, aplica TODAS as migrations
  # desde banco vazio e exige que os contratos EXECUTEM. Ausência do banco falha
  # o job em vez de pular.
  #
  # ISOLAMENTO: ambiente completamente efêmero. Nenhum projeto remoto, nenhum
  # `--linked`, nenhum `db push`, nenhum `project-ref`, nenhuma senha de produção.
  # O `supabase start` local usa chaves default públicas do próprio CLI.
  # ───────────────────────────────────────────────────────────────────────────────
  runtime-db:
    name: Runtime DB contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Confirm Docker is available
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.ServerVersion}}'

      # Aplica as migrations desde banco vazio. Se a sequência histórica deixar
      # de reconstruir o schema, o job falha aqui — que é o invariante provado na
      # TRUST-1.1B e que ninguém deve poder quebrar em silêncio.
      - name: Start local Supabase (ephemeral, no remote link)
        run: supabase start

      # O container do Postgres precisa ter o nome que os testes esperam. O CLI o
      # nomeia `supabase_db_<project_id>` a partir do config.toml, então o nome é
      # determinístico — mas conferimos, para a falha ser diagnóstica em vez de
      # aparecer como "banco indisponível" e virar skip.
      - name: Assert the expected database container is up
        run: |
          NAME=supabase_db_ctjwyybmlwhynherikqy
          docker ps --filter "name=$NAME" --format '{{.Names}} {{.Status}}'
          test -n "$(docker ps --filter "name=$NAME" --format '{{.Names}}')"

      # Consulta direta ao catálogo, e não `supabase migration list`: o formato de
      # saída do CLI muda entre versões, e uma contagem por regex sobre texto
      # decorado é frágil. Esta é a mesma fonte que os testes usam.
      - name: Report applied migrations
        run: |
          COUNT=$(docker exec -i supabase_db_ctjwyybmlwhynherikqy \
            psql -U postgres -d postgres -q -t -A \
            -c "SELECT count(*) FROM supabase_migrations.schema_migrations;")
          echo "Migrations aplicadas desde banco vazio: $COUNT"
          test "$COUNT" -gt 0

      # ─────────────────────────────────────────────────────────────────────
      # TRUST-1.3 — detecta generated types desincronizados do schema local.
      #
      # POR QUE ESTE PASSO EXISTE
      # `src/integrations/supabase/types.ts` é artefato GERADO — a fonte de
      # verdade é migrations → Postgres local → gen types. Já ocorreu (ver
      # TRUST_1_5_SCHEMA_TYPE_CONTRACT.md e o achado UPSTREAM_GENERATED_TYPES_
      # DRIFT da TRUST-1.3) de o arquivo versionado ser regenerado por outra
      # ferramenta (Lovable) contra um schema REMOTO que ainda não tinha
      # recebido as migrations TRUST, removendo colunas e RPCs válidas em
      # silêncio. O CI deve DETECTAR essa divergência, nunca escondê-la
      # regenerando e commitando por conta própria.
      - name: Detect generated types drift against local schema
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.generated.ts
          if ! diff -q src/integrations/supabase/types.ts /tmp/types.generated.ts > /dev/null; then
            echo "::error::src/integrations/supabase/types.ts está desincronizado do schema local (migrations aplicadas). Regenere com 'supabase gen types typescript --local --schema public > src/integrations/supabase/types.ts' usando a MESMA versão do CLI pinada neste workflow (2.115.0) e commit o resultado."
            diff -u src/integrations/supabase/types.ts /tmp/types.generated.ts || true
            exit 1
          fi
          echo "generated types já refletem o schema local reconstruído."

      # NÃO aceitar skip como sucesso: o número de contratos executados é
      # verificado. Se a suíte pular por ausência de banco, o job falha.
      - name: Runtime contracts (RPC, privacy, archive, C2 seats & org link)
        env:
          # Sem cor: a saída do Vitest vem cheia de escapes ANSI, e um `grep` sobre
          # texto decorado não casa. Foi assim que a primeira versão deste passo
          # leu "0 contratos" enquanto 62 tinham passado.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          npx vitest run \
            src/lib/rpc-runtime-contract.test.ts \
            src/lib/archive-runtime-contract.test.ts \
            src/lib/privacy-runtime-contract.test.ts \
            src/lib/server-analytics-runtime-contract.test.ts \
            src/lib/input-integrity-runtime-contract.test.ts \
            src/lib/guardian-consent-runtime-contract.test.ts \
            src/lib/notification-outbox-runtime-contract.test.ts \
            src/lib/c2-org-subscription-seats-runtime-contract.test.ts \
            --reporter=verbose 2>&1 | tee runtime-db.raw.log

          # Remove qualquer escape ANSI remanescente antes de medir.
          sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' runtime-db.raw.log > runtime-db.log

          if grep -qiE '\bskipped\b' runtime-db.log; then
            echo "::error::Contratos de runtime foram PULADOS. Skip não é sucesso (R25)."
            exit 1
          fi

          PASSED=$(grep -oE 'Tests[[:space:]]+[0-9]+[[:space:]]+passed' runtime-db.log \
                   | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "Contratos de runtime executados: $PASSED"
          if [ "$PASSED" -lt 175 ]; then
            echo "::error::Apenas $PASSED contratos executados; esperado ao menos 175 (93 base + 28 TRUST-1.4 + 35 TRUST-1.6 + 5 TRUST-1.6.1 + 14 C2/C2.R)."
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
